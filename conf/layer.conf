# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rini"
BBFILE_PATTERN_meta-rini = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rini = "6"

LAYERDEPENDS_meta-rini = "core"
LAYERSERIES_COMPAT_meta-rini = "scarthgap"
